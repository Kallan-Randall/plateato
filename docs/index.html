<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Plateato — know your kitchen</title>
  <meta name="description" content="Plateato is a shared pantry and shopping list for your household. Track what you have, waste less, shop smarter." />
  <style>
    :root {
      --green: #2F8F5B;
      --green-dark: #1C5C39;
      --plate: #F6FBF6;
      --ring: #E3EFE6;
      --coral: #F0784B;
      --text: #1B2420;
      --text-secondary: #5B6B62;
    }
    * { box-sizing: border-box; margin: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--plate);
      color: var(--text);
      display: flex;
      min-height: 100vh;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    main { text-align: center; max-width: 480px; }
    .mark { width: 120px; height: 120px; margin: 0 auto 24px; }
    h1 { color: var(--green-dark); font-size: 2.2rem; letter-spacing: -0.5px; }
    p.tagline { color: var(--text-secondary); margin-top: 12px; font-size: 1.05rem; line-height: 1.5; }
    .coming { display: inline-block; margin-top: 24px; padding: 8px 18px; border-radius: 999px; background: var(--green); color: #fff; font-size: 0.9rem; }
    footer { margin-top: 40px; font-size: 0.85rem; }
    footer a { color: var(--green); }
  </style>
</head>
<body>
  <main>
    <svg class="mark" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Plateato logo">
      <rect width="1024" height="1024" rx="224" fill="#2F8F5B"/>
      <circle cx="512" cy="512" r="330" fill="#F6FBF6"/>
      <circle cx="512" cy="512" r="235" fill="none" stroke="#E3EFE6" stroke-width="16"/>
      <path d="M 386 610 Q 386 386 610 386 Q 610 610 386 610 Z" fill="#2F8F5B"/>
      <path d="M 430 566 L 566 430" stroke="#F6FBF6" stroke-width="14" stroke-linecap="round" fill="none"/>
      <circle cx="645" cy="645" r="38" fill="#F0784B"/>
    </svg>
    <h1>Plateato</h1>
    <p class="tagline">A shared pantry and shopping list for your household. Track what you have, waste less, shop smarter.</p>
    <span class="coming">Coming soon to Android</span>
    <footer>
      <a href="privacy.html">Privacy policy</a>
    </footer>
  </main>
</body>
</html>
