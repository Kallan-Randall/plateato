<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Email confirmed — Plateato</title>
  <meta name="robots" content="noindex" />
  <style>
    :root {
      --green: #2F8F5B;
      --green-dark: #1C5C39;
      --plate: #F6FBF6;
      --text: #1B2420;
      --text-secondary: #5B6B62;
    }
    * { box-sizing: border-box; margin: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--plate);
      color: var(--text);
      display: flex;
      min-height: 100vh;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
    }
    main { max-width: 440px; }
    .check {
      width: 88px;
      height: 88px;
      margin: 0 auto 24px;
      border-radius: 50%;
      background: var(--green);
      color: #fff;
      font-size: 44px;
      line-height: 88px;
    }
    h1 { color: var(--green-dark); font-size: 1.8rem; margin-bottom: 12px; }
    p { color: var(--text-secondary); line-height: 1.6; }
    .open-app {
      display: inline-block;
      margin-top: 24px;
      padding: 14px 32px;
      border-radius: 12px;
      background: var(--green);
      color: #fff;
      text-decoration: none;
      font-weight: 600;
    }
    .hint { margin-top: 12px; font-size: 0.85rem; }
    footer { margin-top: 32px; font-size: 0.85rem; }
    footer a { color: var(--green); }
  </style>
</head>
<body>
  <main>
    <div class="check">✓</div>
    <h1>Email confirmed</h1>
    <p>
      Your Plateato account is ready. Head back to the app and sign in with your email and
      password.
    </p>
    <a class="open-app" href="plateato://">Open the Plateato app</a>
    <p class="hint">
      Reading this on a computer? Just return to wherever you signed up and sign in there.
    </p>
    <footer>
      <a href="index.html">Plateato</a> · <a href="privacy.html">Privacy policy</a>
    </footer>
  </main>
</body>
</html>
